[package]
name = "movable-typo"
version = "0.1.0"
description = "Turn PDFs into clean, plain HTML readings"
authors = ["Tyler Paige"]
license-file = "../LICENSE"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "macros"] }

[dev-dependencies]
tempfile = "3"
